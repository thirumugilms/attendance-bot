<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QA Tester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 40px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background: white;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <h4 class="text-center mb-4 font-weight-bold">Admin Portal Lock</h4>
        {% if error %}
        <div class="alert alert-danger p-2 text-center" style="font-size: 14px;">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3">
                <label>Username</label>
                <input type="text" name="username" class="form-control bg-light" required autofocus>
            </div>
            <div class="mb-4">
                <label>Password</label>
                <input type="password" name="password" class="form-control bg-light" required>
            </div>
            <button class="btn btn-dark w-100 py-2 font-weight-bold">Unlock Dashboard</button>
        </form>
    </div>
</body>

</html>
