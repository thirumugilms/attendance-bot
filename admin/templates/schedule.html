{% extends "base.html" %}

{% block page_title %}Manage Schedule{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <div class="card p-4">

            <form action="/api/schedule" method="POST">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="mb-0">Daily Execution Times</h5>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" name="enabled"
                            id="scheduleEnabled" {{ 'checked' if schedule.enabled else '' }}>
                        <label class="form-check-label" for="scheduleEnabled">Enable Scheduled Runs</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="timesInput">Execution Times (Comma separated, 24-hour format
                        HH:MM)</label>
                    <input type="text" class="form-control font-monospace" id="timesInput" name="times"
                        placeholder="09:00, 10:00, 11:30" value="{{ schedule.times | join(', ') }}">
                    <div class="form-text">Example: 09:00, 12:30, 15:45</div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted">Timezone (Managed via .env)</label>
                    <input type="text" class="form-control" value="{{ schedule.timezone }}" disabled>
                </div>

                <button type="submit" class="btn btn-primary">Save Schedule configuration</button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
